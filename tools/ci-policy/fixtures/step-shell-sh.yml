# Spec 0013 CS12 fixture: test DATA, never a workflow (outside .github/workflows, GitHub never runs it).
# Expected rejection: a run step overriding the shell with sh
name: fixture
on: pull_request
permissions: { contents: read }
defaults:
  run:
    shell: bash
jobs:
  proofs:
    runs-on: ubuntu-24.04
    steps:
      - shell: sh
        run: node tools/images/gate-proofs.mjs | tee -a "$GITHUB_STEP_SUMMARY"
