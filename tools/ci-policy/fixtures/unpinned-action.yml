# Spec 0013 CS12 fixture: test DATA, never a workflow (outside .github/workflows, GitHub never runs it).
# Expected rejection: an action pinned by tag, and checkout keeping its credentials
name: fixture
on: pull_request
permissions: { contents: read }
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
