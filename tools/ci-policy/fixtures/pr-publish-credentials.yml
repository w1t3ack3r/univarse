# Spec 0013 CS12 fixture: test DATA, never a workflow (outside .github/workflows, GitHub never runs it).
# Expected rejection: PR-reachable job references the publish credentials and pushes
name: fixture
on: pull_request
permissions: { contents: read }
jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
      - env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login registry.example --password-stdin -u ci
          docker push registry.example/univarse-api:pr
          cosign sign --key env://COSIGN_KEY registry.example/univarse-api:pr
