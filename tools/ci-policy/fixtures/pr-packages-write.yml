# Spec 0013 CS12 fixture: test DATA, never a workflow (outside .github/workflows, GitHub never runs it).
# Expected rejection: pull_request workflow requests packages: write
name: fixture
on: [pull_request]
permissions: { contents: read, packages: write }
defaults:
  run:
    shell: bash
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: { persist-credentials: false }
