# Spec 0013 CS7: secret-scan coverage for UniVarse images.
# Trivy's secret scanner skips **/node_modules/** (and .git, lockfiles) by default (pkg/fanal/secret/scanner.go,
# v0.75.0). Deployed workspace packages live in node_modules (pnpm deploy), so nothing is skipped here: an empty
# list disables every default skip pattern. Trivy's built-in allow rules (paths containing test/example/vendor/
# locale, *.md, .dist-info) stay on: they match third-party fixtures, not UniVarse's deployed paths. The CS13
# canaries prove the coverage, including a canary inside node_modules/@univarse/….
skip-patterns: []
