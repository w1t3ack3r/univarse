# Spec 0013 CS7 / ADR-029: accepted exceptions to the image gates. EMPTY BY DEFAULT.
# Every HIGH/CRITICAL vulnerability blocks publication, fixed or not; any secret blocks; HIGH/CRITICAL
# misconfigurations block. An entry here keeps the risk visible and, while any entry is active, the roadmap's
# "0 high/critical findings" exit can't be claimed.
# Each entry needs: id; purls (vulnerabilities) or paths (secrets, misconfigurations); statement (the evidence);
# owner; expired_at (YYYY-MM-DD, at most 30 days ahead). tools/images/exceptions.mjs rejects anything else,
# and an expired entry fails the gate.
vulnerabilities:
  - id: CVE-2026-76844
    purls:
      - pkg:deb/debian/zlib1g@1.3.dfsg%2Breally1.3.1-1%2Bb1?arch=amd64&distro=debian-13.7&epoch=1
    statement: "Not reachable. The overflow is in zlib's gzFile write path (gz_write after a failed write). In all five release images (api, web, console, migrate, pgbouncer) the only ELF linking the system libz.so.1 is OpenSSL's libcrypto.so.3, which uses deflate and inflate, never the gz* API; libcrypto's own users are libssl, OpenSSL's engines, PgBouncer (TLS) and Prisma's schema engine (migrations only), and none of them names a gz* write function. Node carries its own zlib and its zlib module exposes no gz* file API. Debian 13 has no fixed zlib yet (fixed in sid 1:1.3.dfsg+really1.3.2-4, Debian bug 1153063). Remove when the distroless base ships the fix."
    owner: samuel
    expired_at: 2026-12-05
secrets: []
misconfigurations: []
