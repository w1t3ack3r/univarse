# Spec 0013 CS7 / ADR-029: accepted exceptions to the image gates. EMPTY BY DEFAULT.
# Every HIGH/CRITICAL vulnerability blocks publication, fixed or not; any secret blocks; HIGH/CRITICAL
# misconfigurations block. An entry here keeps the risk visible and, while any entry is active, the roadmap's
# "0 high/critical findings" exit can't be claimed.
# Each entry needs: id; purls (vulnerabilities) or paths (secrets, misconfigurations); statement (the evidence);
# owner; expired_at (YYYY-MM-DD, at most 30 days ahead). tools/images/exceptions.mjs rejects anything else,
# and an expired entry fails the gate.
vulnerabilities:
  - id: CVE-2026-76844
    purls:
      - pkg:deb/debian/zlib1g@1.3.dfsg%2Breally1.3.1-1%2Bb1?arch=amd64&distro=debian-13.7&epoch=1
    statement: "Not reachable. The overflow is in zlib's gzFile write path (gz_write after a failed write). In all five release images (api, web, console, migrate, pgbouncer) the only ELF linking the system libz.so.1 is OpenSSL's libcrypto.so.3, which uses deflate and inflate, never the gz* API; libcrypto's own users are libssl, OpenSSL's engines, PgBouncer (TLS) and Prisma's schema engine (migrations only), and none of them names a gz* write function. Node carries its own zlib and its zlib module exposes no gz* file API. Debian 13 has no fixed zlib yet (fixed in sid 1:1.3.dfsg+really1.3.2-4, Debian bug 1153063). Remove when the distroless base ships the fix."
    owner: samuel
    expired_at: 2026-12-05
  - id: CVE-2026-85091
    purls:
      - pkg:deb/debian/zlib1g@1.3.dfsg%2Breally1.3.1-1%2Bb1?arch=amd64&distro=debian-13.7&epoch=1
    statement: "Not reachable, on the same evidence as CVE-2026-76844 above (the same Debian fix). The overflow is in gz_vacate, reached only through gzwrite or gzprintf after a write stall. In all five release images no ELF but the system libz.so.1 and Node's own bundled zlib names gzwrite, gzputs or gzprintf; the only ELF linking libz.so.1 is libcrypto.so.3 (deflate and inflate only), and Node's zlib module exposes no gz* file API. Debian 13 has no fixed zlib yet (fixed in sid with 76844). Remove with 76844."
    owner: samuel
    expired_at: 2026-12-05
  - id: CVE-2026-124709
    purls:
      - pkg:deb/debian/libssl3t64@3.5.7-1~deb13u3?arch=amd64&distro=debian-13.7
    statement: "Not reachable. The leak is in OpenSSL's QUIC server: a stream the server rejects is kept (about 300 bytes) when the client resets it first, so only a process that accepts QUIC connections is affected. Nothing in the five release images is a QUIC server. Of all their ELFs, only three link the system libssl.so.3: Prisma's schema engine (api, migrate; a TLS client to PostgreSQL) and pgbouncer (TLS over TCP); none of them imports any QUIC API (OSSL_QUIC_*_method, SSL_new_listener, SSL_new_stream, SSL_accept_stream, SSL_accept_connection). web and console link it not at all. Node does not use the system libssl: it carries its own OpenSSL 3.5.8 with QUIC compiled out (process.features.quic false; node:quic does not exist), and no UniVarse code, config or the stack uses QUIC or HTTP/3. Debian 13 has no fixed libssl3t64 yet (upstream fixed in 3.5.10). Remove when the base images carry it."
    owner: samuel
    expired_at: 2026-12-22
  - id: CVE-2026-107494
    purls:
      - pkg:deb/debian/libssl3t64@3.5.7-1~deb13u3?arch=amd64&distro=debian-13.7
    statement: "Not reachable, on the same evidence as CVE-2026-124709 above (the same package, also in OpenSSL's QUIC stack). The flaw is in QUIC's handling of RETIRE_CONNECTION_ID frames, so only a process holding a QUIC connection is affected, as client or server. Of all the ELFs in the five release images, only Prisma's schema engine (api, migrate) and pgbouncer link the system libssl.so.3, and none of them imports any QUIC API, client or server (OSSL_QUIC_client_method, OSSL_QUIC_client_thread_method, OSSL_QUIC_server_method, SSL_new_listener, SSL_new_stream, SSL_accept_stream, SSL_accept_connection); web and console link it not at all. Node uses its own OpenSSL with QUIC compiled out, and no UniVarse code, config or the stack uses QUIC or HTTP/3. Debian has no fixed libssl3t64 in any release yet. Remove when the base images carry it."
    owner: samuel
    expired_at: 2026-12-23
  - id: CVE-2026-124851
    purls:
      - pkg:deb/debian/libzstd1@1.5.7%2Bdfsg-1?arch=amd64&distro=debian-13.7
    statement: "No attacker-controlled input reaches it, and its output never returns to a peer (verified 2026-11-25, as the owner required). The flaw leaks up to 64 KiB of a decoder buffer into DEcompressed output, so it needs crafted compressed input AND the output sent back to whoever supplied it. In all five release images the only ELF linking the system libzstd.so.1 is OpenSSL's libcrypto.so.3 (ZSTD_decompress and the DStream API, for BIO_f_zstd and TLS certificate compression); no UniVarse binary imports BIO_f_zstd, and a decompressed certificate is parsed locally, never sent back. The processes using that OpenSSL take no certificate from outside: pgbouncer serves clients with client_tls_sslmode = require (no client certificate requested) and, as a client, receives only the stack's own PostgreSQL certificate (verify-full); Prisma's schema engine (api, migrate) runs migrations against that same PostgreSQL. Node does not use this package. Debian 13 has the fix (1.5.7+dfsg-1+deb13u1); distroless's newest base-debian13 and nodejs24-debian13 still ship 1.5.7+dfsg-1. Remove when a base image carries the fix; reassess 2026-12-01. Node's own bundled zstd 1.5.7 is outside this entry (Trivy can't see it) and is tracked separately."
    owner: samuel
    expired_at: 2026-12-25
secrets: []
