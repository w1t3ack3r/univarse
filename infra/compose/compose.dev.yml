# Local development dependencies — docs/10-infrastructure-and-deployment.md §4
#   pnpm dev:infra            → valkey + mailpit + vault (then unseals and configures Vault)
#   pnpm dev:infra:docs       → + gotenberg + clamav (large images)
# PostgreSQL 18 runs natively on the host (see `pnpm db:setup`).
#
# Hardening (docs/09 §4.2): every port bound to 127.0.0.1 only, all capabilities dropped,
# no-new-privileges, read-only root FS where the image allows it, bounded logs.
# NOTE: dev pins by tag; production manifests pin by digest.

name: univarse-dev

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }

services:
  valkey:
    image: valkey/valkey:8-alpine
    <<: *hardening
    read_only: true
    user: '999:1000'
    command: ['valkey-server', '--requirepass', '${VALKEY_PASSWORD:?run pnpm dev:secrets}', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:6379:6379']
    tmpfs: ['/data:size=256m,uid=999']
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      retries: 10
    environment: { VALKEY_PASSWORD: '${VALKEY_PASSWORD}' }

  mailpit:
    image: axllent/mailpit:v1.27
    <<: *hardening
    read_only: true
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # web UI
    environment: { MP_MAX_MESSAGES: '2000' }
    # Mailpit keeps its message DB in /tmp; the root FS stays read-only.
    tmpfs: ['/tmp:size=128m']

  # KEK for envelope encryption (spec 0006, ADR-023). Persistent file storage; unsealed and
  # configured by tools/vault-dev.mjs (pnpm dev:infra runs it).
  vault:
    image: hashicorp/vault:2.1.1
    <<: *hardening
    # The image entrypoint drops to the vault user and fixes volume ownership; it needs these.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    # The entrypoint's `server` already loads every file in /vault/config; adding -config twice binds twice.
    command: ['server']
    ports: ['127.0.0.1:8200:8200']
    volumes:
      - vault-data:/vault/file
      - ./vault/dev.hcl:/vault/config/dev.hcl:ro
    environment: { VAULT_ADDR: 'http://127.0.0.1:8200' }

  gotenberg:
    image: gotenberg/gotenberg:8
    profiles: [docs]
    <<: *hardening
    # Render only supplied HTML: no JS, no outbound fetches (docs/09 §6).
    command: ['gotenberg', '--chromium-disable-javascript=true', '--chromium-allow-list=^file:///tmp/.*', '--api-timeout=30s']
    ports: ['127.0.0.1:3100:3000']

  clamav:
    image: clamav/clamav:stable
    profiles: [docs]
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    ports: ['127.0.0.1:3310:3310']

volumes:
  vault-data:
