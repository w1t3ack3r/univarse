# Local development dependencies — docs/10-infrastructure-and-deployment.md §4
#   pnpm dev:infra            → valkey + mailpit + vault (then unseals and configures Vault)
#   pnpm dev:infra:docs       → + gotenberg (large image)
#   seaweedfs + clamav start by default (file uploads, spec 0010)
# PostgreSQL 18 runs natively on the host (see `pnpm db:setup`).
#
# Hardening (docs/09 §4.2): every port bound to 127.0.0.1 only, all capabilities dropped,
# no-new-privileges, read-only root FS where the image allows it, bounded logs.
# NOTE: dev pins by tag; production manifests pin by digest.

name: univarse-dev

x-hardening: &hardening
  cap_drop: [ALL]
  security_opt: ['no-new-privileges:true']
  restart: unless-stopped
  logging: { driver: json-file, options: { max-size: '10m', max-file: '3' } }

services:
  valkey:
    image: valkey/valkey:8-alpine
    <<: *hardening
    read_only: true
    user: '999:1000'
    command: ['valkey-server', '--requirepass', '${VALKEY_PASSWORD:?run pnpm dev:secrets}', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:6379:6379']
    tmpfs: ['/data:size=256m,uid=999']
    healthcheck:
      test: ['CMD-SHELL', 'valkey-cli -a "$$VALKEY_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 5s
      retries: 10
    environment: { VALKEY_PASSWORD: '${VALKEY_PASSWORD}' }

  mailpit:
    image: axllent/mailpit:v1.27
    <<: *hardening
    read_only: true
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # web UI
    environment: { MP_MAX_MESSAGES: '2000' }
    # Mailpit keeps its message DB in /tmp; the root FS stays read-only.
    tmpfs: ['/tmp:size=128m']

  # KEK for envelope encryption (spec 0006, ADR-023). Persistent file storage; unsealed and
  # configured by tools/vault-dev.mjs (pnpm dev:infra runs it).
  vault:
    image: hashicorp/vault:2.1.1
    <<: *hardening
    # The image entrypoint drops to the vault user and fixes volume ownership; it needs these.
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    # The entrypoint's `server` already loads every file in /vault/config; adding -config twice binds twice.
    command: ['server']
    ports: ['127.0.0.1:8200:8200']
    volumes:
      - vault-data:/vault/file
      - ./vault/dev.hcl:/vault/config/dev.hcl:ro
    environment: { VAULT_ADDR: 'http://127.0.0.1:8200' }

  gotenberg:
    image: gotenberg/gotenberg:8
    profiles: [docs]
    <<: *hardening
    # Render only supplied HTML: no JS, no outbound fetches (docs/09 §6).
    command: ['gotenberg', '--chromium-disable-javascript=true', '--chromium-allow-list=^file:///tmp/.*', '--api-timeout=30s']
    ports: ['127.0.0.1:3100:3000']

  # S3-compatible object storage (ADR-025: SeaweedFS; MinIO is unmaintained). S3 gateway only.
  # tools/storage-dev.mjs writes seaweedfs/s3.json (git-ignored) from .env and creates the buckets.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    <<: *hardening
    # The entrypoint drops root with su-exec and fixes /data ownership; it needs these (like Vault).
    cap_add: [CHOWN, SETUID, SETGID, DAC_OVERRIDE, FOWNER]
    command: ['server', '-dir=/data', '-ip.bind=0.0.0.0', '-s3', '-s3.port=8333', '-s3.config=/etc/seaweedfs/s3.json', '-master.volumeSizeLimitMB=128', '-volume.max=16']
    ports: ['127.0.0.1:8333:8333']
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # Copies the test-only signature (spec 0010 FU16) from the read-only repo fixture into ClamAV's own
  # database volume, then exits. ClamAV never sees the repository. Dev/CI only; never deployed.
  clamav-test-sigs:
    image: clamav/clamav:stable
    entrypoint: ['sh', '-c', 'cp /fixtures/univarse-test.ndb /var/lib/clamav/univarse-test.ndb']
    restart: 'no'
    security_opt: ['no-new-privileges:true']
    volumes:
      - clamav-db:/var/lib/clamav
      - ./clamav/test-sigs:/fixtures:ro

  # Virus scanning for uploads (spec 0010). The image ships with signatures; FreshClam still updates
  # them (set CLAMAV_NO_FRESHCLAMD=true in .env on a slow link: stale signatures, local only).
  # The normal signature databases stay in place; the test signature is one extra file beside them.
  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    ports: ['127.0.0.1:3310:3310']
    environment: { CLAMAV_NO_FRESHCLAMD: '${CLAMAV_NO_FRESHCLAMD:-false}' }
    depends_on:
      clamav-test-sigs: { condition: service_completed_successfully }
    volumes:
      - clamav-db:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdscan --ping 3 >/dev/null 2>&1 || echo PING | nc -w 2 127.0.0.1 3310 | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

volumes:
  vault-data:
  seaweedfs-data:
  clamav-db:
