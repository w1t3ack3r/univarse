# collector.yaml plus Jaeger (local only, off by default: spec 0012 D2). `pnpm dev:traces:jaeger`.
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 200
  batch:
    timeout: 500ms

exporters:
  file:
    path: /out/traces.jsonl
    format: json
    flush_interval: 500ms
    rotation:
      max_megabytes: 50
      max_backups: 2
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    logs: { level: warn }
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [file, otlp/jaeger]
