# CI — docs/13-ci-cd-and-workflow.md §3 (Phase 0 subset).
# Every job must pass before merge to main.
# Actions are pinned to full commit SHAs (resolved via the GitHub API 2026-10-01); Renovate bumps them.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --verbose --no-banner --exit-code 1 .  # --verbose: file, line, rule, fingerprint; the secret stays redacted

  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-superuser-only
          # A non-UTC server, like a real install in Nigeria: catches timestamp-encoding bugs
          # that a UTC server hides (packages/db/test/timezone.int.spec.ts).
          TZ: Africa/Lagos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      # E2E reads emailed activation/reset codes from Mailpit (spec 0005 W15). Same image as local dev.
      mailpit:
        image: axllent/mailpit:v1.27
        ports: ['1025:1025', '8025:8025']
      # KEK for envelope encryption (spec 0006, ADR-023). Dev mode is fine for an ephemeral CI run;
      # tools/vault-dev.mjs configures Transit, the derived KEK and a least-privilege app token.
      vault:
        image: hashicorp/vault:2.1.1
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ci-root-token-only
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          SKIP_SETCAP: 'true'
        ports: ['8200:8200']
    env:
      NODE_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGSUPERPASSWORD: ci-superuser-only
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fail on high/critical — docs/09 §1)
        run: pnpm audit --audit-level high
      - name: Generate CI-only secrets
        run: |
          echo "SESSION_PEPPER=$(openssl rand -base64 32)" >> .env
          echo "DATA_ENCRYPTION_KEY_ID=ci-1" >> .env
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> .env
          echo "S3_ACCESS_KEY=uvci$(openssl rand -hex 8)" >> .env
          echo "S3_SECRET_KEY=$(openssl rand -hex 30)" >> .env
      # Spec 0010 / ADR-025: the SAME compose services and settings as dev (SeaweedFS; ClamAV with the
      # fail-closed CLAMD_CONF_* options and the test-only signature copied from a read-only fixture).
      # Started early so ClamAV loads its signatures while the build runs. VALKEY_PASSWORD only satisfies
      # compose interpolation; CI's Valkey is the service above.
      - name: Start object storage + ClamAV (compose, same as dev)
        env: { VALKEY_PASSWORD: ci-compose-interpolation-only }
        run: |
          node tools/storage-dev.mjs config
          docker compose -f infra/compose/compose.dev.yml --env-file .env up -d seaweedfs clamav-test-sigs clamav
      - name: Build (includes Prisma generate)
        run: pnpm build
      - name: No test helpers in the API build (CLAUDE.md invariant 8)
        run: |
          if [ -e apps/api/dist/testing ]; then
            echo "apps/api/dist/testing exists: test helpers leaked into the production build" >&2
            exit 1
          fi
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (typescript-eslint strict-type-checked)
        run: pnpm lint
      - name: Unit tests (domain coverage gates enforced)
        run: pnpm test

      - name: Create roles + databases (least privilege)
        run: pnpm db:setup
      - name: Migrate
        run: pnpm db:migrate
      - name: Configure Vault (Transit, derived KEK, encrypt/decrypt-only app token)
        env:
          VAULT_ROOT_TOKEN: ci-root-token-only
        run: node tools/vault-dev.mjs
      - name: RLS gate
        run: pnpm rls:check
      - name: Seed (twice — must be idempotent)
        run: pnpm db:seed && pnpm db:seed
      - name: Wait for SeaweedFS + ClamAV, create buckets, show ClamAV's effective fail-closed settings
        env: { VALKEY_PASSWORD: ci-compose-interpolation-only }
        run: |
          docker compose -f infra/compose/compose.dev.yml --env-file .env up -d --wait seaweedfs clamav
          node tools/storage-dev.mjs buckets
          docker exec univarse-dev-clamav-1 clamconf | grep -E '^(AlertExceedsMax|AlertEncrypted|AlertEncryptedDoc|AlertEncryptedArchive|StreamMaxLength|MaxScanSize) '
      - name: SeaweedFS + ClamAV logs (on failure)
        if: failure()
        run: |
          docker logs --tail 80 univarse-dev-seaweedfs-1 || true
          docker logs --tail 40 univarse-dev-clamav-1 || true
      - name: DB isolation tests (as app role)
        run: pnpm --filter @univarse/db test:int
      - name: Envelope encryption tests against real Vault (spec 0006)
        run: pnpm --filter @univarse/crypto test:int
      # Includes the storage contract tests (FU11, D1 gate) and the file flow against real SeaweedFS + ClamAV.
      - name: API integration tests
        # Verbose: every test's result is in the log, not just totals (spec 0010 completion record).
        run: pnpm --filter @univarse/api test:int --reporter=verbose
      - name: Install Playwright Chromium (spec 0005 W10)
        run: pnpm --filter @univarse/web exec playwright install --with-deps chromium
      - name: E2E — edge → web → API → DB, desktop + mobile (spec 0005 W10)
        run: pnpm --filter @univarse/web test:e2e
