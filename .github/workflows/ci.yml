# CI — docs/13-ci-cd-and-workflow.md §3 (Phase 0 subset).
# Every job must pass before merge to main.
# Actions are pinned to full commit SHAs (resolved via the GitHub API 2026-10-01); Renovate bumps them.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .

  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-superuser-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGSUPERPASSWORD: ci-superuser-only
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - name: Dependency audit (fail on high/critical — docs/09 §1)
        run: pnpm audit --audit-level high
      - name: Generate CI-only secrets
        run: |
          echo "SESSION_PEPPER=$(openssl rand -base64 32)" >> .env
          echo "DATA_ENCRYPTION_KEY_ID=ci-1" >> .env
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> .env
      - name: Build (includes Prisma generate)
        run: pnpm build
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (domain coverage gates enforced)
        run: pnpm test

      - name: Create roles + databases (least privilege)
        run: pnpm db:setup
      - name: Migrate
        run: pnpm db:migrate
      - name: RLS gate
        run: pnpm rls:check
      - name: Seed (twice — must be idempotent)
        run: pnpm db:seed && pnpm db:seed
      - name: DB isolation tests (as app role)
        run: pnpm --filter @univarse/db test:int
      - name: API integration tests
        run: pnpm --filter @univarse/api test:int
