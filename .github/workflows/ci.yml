# CI — docs/13-ci-cd-and-workflow.md §3 (Phase 0 subset).
# Every job must pass before merge to main.
# Actions are pinned to full commit SHAs (resolved via the GitHub API); Dependabot proposes their updates weekly (spec 0024 G11).
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Every run step uses `bash --noprofile --norc -eo pipefail`: without an explicit shell GitHub runs `bash -e`, and a
# failing command piped into `tee` would pass (spec 0013 CS12/CS13; the workflow policy rejects any other shell).
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0, persist-credentials: false }
      - name: gitleaks (checksum-verified)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --redact --verbose --no-banner --exit-code 1 .  # --verbose: file, line, rule, fingerprint; the secret stays redacted

  # Spec 0024: the security gates, in parallel with build-test. Each scanner is pinned (G5), blocks at its threshold
  # on the whole tree (G2, G3), honours only exceptions that pass tools/security/exceptions.mjs (G4), and is then proved
  # to block on a fixture, for the intended finding (G8). Findings below the threshold go to the job summary.
  security-scans:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SEMGREP_IMAGE: semgrep/semgrep@sha256:529ee8a277ec8adc5b534d7c74eea0a47e9de21d62852b6ba7ac6ba9566845c3 # 1.180.0
      CHECKOV_IMAGE: bridgecrew/checkov@sha256:19ab1e9a08bf76f78391ca6fa46bb62fd08737e4e66466b16a82aa2d1337e153 # the 3.3.28 tag; its CLI reports 3.3.27
      OSV_VERSION: 2.7.0
      OSV_SHA256: 160c6253e2922e9e0a6a9771c5c4c40a4b3c6090b34a3cdd5e80c96cc2e4218b
      SEMGREP_RULES: --config p/typescript --config p/nodejs --config p/owasp-top-ten --config p/github-actions --config p/dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # G10: a squash merge makes the title the commit on main. The title reaches the script by environment only.
      - name: The PR title is a Conventional Commit (spec 0024 G10)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node tools/security/pr-title.mjs
      - name: The gates' own logic (spec 0024)
        run: node --test tools/security/security.test.mjs
      - name: Exceptions, checked before any scan (spec 0024 G4)
        run: node tools/security/exceptions.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Semgrep (spec 0024 G3, G5)
        run: |
          # shellcheck disable=SC2086 # SEMGREP_RULES is a list of flags
          docker run --rm -v "$PWD:/src:ro" -w /src "$SEMGREP_IMAGE" semgrep scan --metrics=off --disable-version-check $SEMGREP_RULES --json --quiet \
            --exclude node_modules --exclude dist --exclude .next --exclude generated --exclude tools/security/fixtures --exclude tools/ci-policy/fixtures . > semgrep.json
          node tools/security/gates.mjs semgrep semgrep.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: osv-scanner (checksum-verified; spec 0024 G3, G5)
        run: |
          curl -sSfLo osv-scanner "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64"
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          # Exit 1 means "vulnerabilities found", which the gate decides on; anything above 1 is a failed scan.
          status=0; ./osv-scanner scan source --config osv-scanner.toml --lockfile pnpm-lock.yaml --format json > osv.json || status=$?
          if [ "$status" -gt 1 ]; then echo "osv-scanner failed (exit $status)"; exit "$status"; fi
          node tools/security/gates.mjs osv osv.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Licenses (spec 0024 G6)
        run: node tools/security/licenses.mjs 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Checkov, the Dockerfiles and the workflows (spec 0024 G3, G5)
        run: |
          status=0; docker run --rm -v "$PWD:/src:ro" "$CHECKOV_IMAGE" -d /src --framework dockerfile github_actions --skip-download --quiet --compact -o json \
            --skip-path node_modules --skip-path tools/security/fixtures --skip-path tools/ci-policy/fixtures > checkov.json || status=$?
          if [ "$status" -gt 1 ]; then echo "Checkov failed (exit $status)"; exit "$status"; fi
          node tools/security/gates.mjs checkov checkov.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      # G8: each gate blocks on its fixture, for the intended finding. A proof that passes for the wrong reason fails.
      - name: Proofs, each gate fails for its intended reason (spec 0024 G8)
        run: |
          F=tools/security/fixtures
          docker run --rm -v "$PWD/$F/semgrep:/src:ro" -w /src "$SEMGREP_IMAGE" semgrep scan --metrics=off --disable-version-check --config p/typescript --config p/nodejs --json --quiet . > proof-semgrep.json
          node tools/security/gates.mjs semgrep proof-semgrep.json --expect gcm-no-tag-length
          status=0; ./osv-scanner scan source --lockfile "pnpm-lock.yaml:$F/osv/vulnerable-lockfile.yaml" --format json > proof-osv.json || status=$?
          if [ "$status" -gt 1 ]; then echo "osv-scanner failed (exit $status)"; exit "$status"; fi
          node tools/security/gates.mjs osv proof-osv.json --expect GHSA-35jh-r3h4-6jhm
          status=0; docker run --rm -v "$PWD/$F/checkov:/src:ro" "$CHECKOV_IMAGE" -d /src --framework dockerfile github_actions --skip-download --quiet --compact -o json > proof-checkov.json || status=$?
          if [ "$status" -gt 1 ]; then echo "Checkov failed (exit $status)"; exit "$status"; fi
          node tools/security/gates.mjs checkov proof-checkov.json --expect CKV_DOCKER_3
          node tools/security/gates.mjs checkov proof-checkov.json --expect CKV_GHA_2
          # These must fail, and for their reason: a crash fails too, so each proof also checks the message. Not with a
          # bare `!`: bash's -e ignores a negated command, so a gate that passed would go unnoticed.
          refuses() {
            local want="$1" out; shift
            if out=$("$@" 2>&1); then echo "PROOF FAILED: it passed: $*"; return 1; fi
            echo "$out"
            if ! grep -qF -- "$want" <<<"$out"; then echo "PROOF FAILED: it did not fail for \"$want\": $*"; return 1; fi
          }
          refuses 'copyleft-server@2.0.0: AGPL-3.0-only is not on the allowlist' node tools/security/licenses.mjs --prod "$F/licenses/prod.json" --dev "$F/licenses/dev.json"
          refuses 'expired on 2020-01-01' node tools/security/exceptions.mjs --root "$F/exceptions/expired"
          refuses 'must name its rule and give a reason' node tools/security/exceptions.mjs --root "$F/exceptions/blanket-suppression"
          refuses 'CKV_DOCKER_2 has no reason' node tools/security/exceptions.mjs --root "$F/exceptions/checkov-no-reason"
          refuses 'missing owner' node tools/security/exceptions.mjs --root "$F/exceptions/license-no-owner"
          echo "Every gate blocked on its fixture, for its intended finding." | tee -a "$GITHUB_STEP_SUMMARY"

  # Spec 0024 G7: CodeQL with no upload, so the job keeps CI's read-only token (spec 0013 CS12). The SARIF is decided
  # on here, kept as a run artifact, and its proof runs the same CLI on a fixture database.
  codeql:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        id: codeql
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: .github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          upload: never
          output: codeql-results
          category: univarse
      - name: Decide on the SARIF (spec 0024 G3)
        run: node tools/security/gates.mjs codeql codeql-results/javascript.sarif 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Proof, CodeQL blocks on a command injection (spec 0024 G8)
        env:
          CODEQL: ${{ steps.codeql.outputs.codeql-path }}
        run: |
          "$CODEQL" database create proof-db --language=javascript --build-mode=none --source-root tools/security/fixtures/codeql
          "$CODEQL" database analyze proof-db codeql/javascript-queries:codeql-suites/javascript-security-extended.qls --format=sarif-latest --output=proof.sarif
          node tools/security/gates.mjs codeql proof.sarif --expect js/command-line-injection
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-sarif
          path: codeql-results/
          retention-days: 30

  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40 # spec 0013 adds two image builds and their checks
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-superuser-only
          # A non-UTC server, like a real install in Nigeria: catches timestamp-encoding bugs
          # that a UTC server hides (packages/db/test/timezone.int.spec.ts).
          TZ: Africa/Lagos
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      # E2E reads emailed activation/reset codes from Mailpit (spec 0005 W15). Same image as local dev.
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports: ['1025:1025', '8025:8025']
      # Vault (spec 0006, ADR-023) runs from compose, as in dev, not as a service: the production images refuse a
      # plaintext VAULT_ADDR (spec 0019 C1), so it needs its TLS listener and certificate (see "Start Vault" below).
    env:
      NODE_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGSUPERPASSWORD: ci-superuser-only
      VALKEY_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Spec 0013 CS12: read-only policy check over the real workflows (positive control) and the fixtures in
      # tools/ci-policy/fixtures (test data, never run). Policy verification; no live fork test.
      - name: Workflow policy — read-only, no privileged triggers, no credentials where PR code runs (spec 0013 CS12)
        run: |
          node --test tools/ci-policy/workflow-policy.test.mjs
          node tools/ci-policy/workflow-policy.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Dependency audit (fail on high/critical — docs/09 §1)
        run: pnpm audit --audit-level high
      - name: Generate CI-only secrets
        run: |
          echo "SESSION_PEPPER=$(openssl rand -base64 32)" >> .env
          echo "DATA_ENCRYPTION_KEY_ID=ci-1" >> .env
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> .env
          echo "S3_ACCESS_KEY=uvci$(openssl rand -hex 8)" >> .env
          echo "S3_SECRET_KEY=$(openssl rand -hex 30)" >> .env
      # Spec 0010 / ADR-025: the SAME compose services and settings as dev (SeaweedFS; ClamAV with the
      # fail-closed CLAMD_CONF_* options and the test-only signature copied from a read-only fixture).
      # Started early so ClamAV loads its signatures while the build runs. VALKEY_PASSWORD only satisfies
      # compose interpolation; CI's Valkey is the service above.
      - name: Start object storage + ClamAV (compose, same as dev)
        env: { VALKEY_PASSWORD: ci-compose-interpolation-only }
        run: |
          node tools/storage-dev.mjs config
          docker compose -f infra/compose/compose.dev.yml --env-file .env up -d seaweedfs clamav-test-sigs clamav
      - name: Build (includes Prisma generate)
        run: pnpm build
      - name: API contract files are regenerated and committed (spec 0011 OA9)
        run: sh tools/api-contract/check-fresh.sh
      - name: No test helpers in the API build (CLAUDE.md invariant 8)
        run: |
          if [ -e apps/api/dist/testing ]; then
            echo "apps/api/dist/testing exists: test helpers leaked into the production build" >&2
            exit 1
          fi
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint (typescript-eslint strict-type-checked)
        run: pnpm lint
      - name: Unit tests (domain coverage gates enforced)
        run: pnpm test
      - name: The local hooks' own logic — install, the pinned gitleaks, the commit message (spec 0024 H1, H2)
        run: node --test tools/hooks/hooks.test.mjs

      - name: Create roles + databases (least privilege)
        run: pnpm db:setup
      - name: Migrate
        run: pnpm db:migrate
      - name: Start Vault as in dev, with its TLS listener for the images (spec 0019 C1)
        env: { VALKEY_PASSWORD: ci-compose-interpolation-only }
        run: |
          node tools/vault-tls.mjs
          docker compose -f infra/compose/compose.dev.yml --env-file .env up -d --wait vault
      - name: Configure Vault (initialise, unseal, Transit, derived KEK, encrypt/decrypt-only app token)
        run: node tools/vault-dev.mjs
      - name: RLS gate
        run: pnpm rls:check
      - name: Seed (twice — must be idempotent)
        run: pnpm db:seed && pnpm db:seed
      - name: Wait for SeaweedFS + ClamAV, create buckets, show ClamAV's effective fail-closed settings
        env: { VALKEY_PASSWORD: ci-compose-interpolation-only }
        run: |
          docker compose -f infra/compose/compose.dev.yml --env-file .env up -d --wait seaweedfs clamav
          node tools/storage-dev.mjs buckets
          docker exec univarse-dev-clamav-1 clamconf | grep -E '^(AlertExceedsMax|AlertEncrypted|AlertEncryptedDoc|AlertEncryptedArchive|StreamMaxLength|MaxScanSize) '
      - name: SeaweedFS + ClamAV logs (on failure)
        if: failure()
        run: |
          docker logs --tail 80 univarse-dev-seaweedfs-1 || true
          docker logs --tail 40 univarse-dev-clamav-1 || true
      - name: DB isolation tests (as app role)
        # Spec 0017 PB3: machine-readable results too, for pgbouncer-compare.
        run: pnpm --filter @univarse/db test:int --reporter=default --reporter=json --outputFile.json="$GITHUB_WORKSPACE/suite-results/db.json"
      - name: Envelope encryption tests against real Vault (spec 0006)
        run: pnpm --filter @univarse/crypto test:int --reporter=default --reporter=json --outputFile.json="$GITHUB_WORKSPACE/suite-results/crypto.json"
      # Includes the storage contract tests (FU11, D1 gate) and the file flow against real SeaweedFS + ClamAV.
      - name: API integration tests
        # Verbose: every test's result is in the log, not just totals (spec 0010 completion record).
        run: pnpm --filter @univarse/api test:int --reporter=verbose --reporter=json --outputFile.json="$GITHUB_WORKSPACE/suite-results/api.json"
      - name: Keep the suites' results for pgbouncer-compare (spec 0017 PB3)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-results-direct
          path: suite-results/
          retention-days: 30
          if-no-files-found: warn
      # Spec 0020 A2-13: the destruction protocol and its recovery against the real keys CLI (the API's build) and this
      # disposable database, the two named BK11 cases included. After the suites above: it clears their key_destruction
      # rows, so its one ledger accounts for every row, and it refuses to run outside CI.
      - name: Shred ledger protocol against the real keys CLI and database (spec 0020)
        run: pnpm --filter @univarse/stack test:ledger
      # Spec 0020 (the bucket copy's fix): the ledger's bucket copy against the stack's own SeaweedFS (its pinned image,
      # flags, environment and memory limit from infra/stack/compose.yml), in a container of its own with throwaway keys:
      # the owner's pre-fix state reproduced, then the upgrade, its volume growth, retention, limits and stack:bucket-check.
      - name: Shred ledger bucket copy against the stack's SeaweedFS (spec 0020)
        run: pnpm --filter @univarse/stack test:bucket
      # Spec 0020 PR B1, against the stack's pinned images on volumes of their own: Vault migrated from file storage to
      # Raft (B-4, BK5's first half: every wrapped key still unwraps, the file storage is never written, the backup token
      # takes a snapshot and nothing else); PostgreSQL 18's archive_command and pg_basebackup's stream (B-2, B-3).
      - name: Backups' containers, Vault's migration to Raft and PostgreSQL's archiving (spec 0020 B1)
        run: pnpm --filter @univarse/stack test:backup
      # Spec 0020 B2-13: the restore's own steps on the stack's pinned images, in containers and volumes of their own:
      # PostgreSQL recovered to a time from a sealed base backup and the shipped WAL (BK4), a past-the-WAL time refused;
      # Vault from a sealed Raft snapshot, opened with the first Vault's key (BK5); the files through the filer and back
      # over S3 (B2-8); and everything labelled removed by its label (BK6). The full rehearsal and drill are the owner's.
      - name: The restore's steps on the pinned images (spec 0020 B2-13)
        run: pnpm --filter @univarse/stack test:restore
      # Spec 0023, on a throwaway Vault of the stack's pinned image: both tokens periodic at 768 h, renewal back to the
      # full period, the policies' self paths and nothing more, a dead token re-issued (and Vault's answers for a dead
      # token and a sealed Vault pinned), and the app's renewer keeping a short-period token alive.
      - name: The stack's Vault tokens, renewed and re-issued (spec 0023)
        run: pnpm --filter @univarse/stack test:vault
      # Spec 0012 OB12: the compiled API and worker as two separate processes, each initialized by its own
      # `--import ./dist/otel.js`, exporting to the same collector service as dev (pinned image, file output).
      # Asserts trace structure (parent chain across the outbox, scan link, pg/Valkey spans, service.name)
      # and, on Linux, the SIGTERM shutdown flush. Runs after the integration tests: it shares their DB.
      - name: Start the OpenTelemetry Collector (compose, same as dev)
        run: node tools/traces-dev.mjs
      - name: Traces across separate compiled processes, through a real collector (spec 0012 OB12)
        run: pnpm --filter @univarse/api test:ob12 --reporter=verbose
      - name: Collector logs (on failure)
        if: failure()
        run: |
          docker logs --tail 60 univarse-dev-otel-collector-1 || true
          ls -la infra/compose/otel/out || true
      - name: Install Playwright Chromium (spec 0005 W10)
        run: pnpm --filter @univarse/web exec playwright install --with-deps chromium
      - name: E2E — edge → web → API → DB, desktop + mobile (spec 0005 W10)
        run: pnpm --filter @univarse/web test:e2e
      # Spec 0026 SB3–SB6: every packages/ui story as a browser test with axe (the same Chromium build as the E2E),
      # the proof that the gate fails broken stories for the right rules, and the static build.
      - name: Storybook — every story a test, accessibility violations fail (spec 0026 SB3, SB4)
        run: pnpm --filter @univarse/ui test:stories
      - name: Storybook — the accessibility gate's proof (spec 0026 SB6)
        run: pnpm --filter @univarse/ui test:a11y-proof
      - name: Storybook — the static build (spec 0026 SB5)
        run: pnpm --filter @univarse/ui storybook:build

      # Spec 0013: the images UniVarse builds (API/worker, web, and spec 0019's migrate job). Built once here; every check below runs
      # against that build. PR runs never push or sign (this job is contents: read only).
      - name: Verify the distroless base image's upstream signature (spec 0013 CS3)
        env:
          COSIGN_VERSION: 3.1.3
          COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        run: |
          curl -sSfLo cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          chmod +x cosign
          api_base=$(grep -oP '^ARG RUNTIME_IMAGE=\K\S+' infra/docker/api.Dockerfile)
          web_base=$(grep -oP '^ARG RUNTIME_IMAGE=\K\S+' infra/docker/web.Dockerfile)
          migrate_base=$(grep -oP '^ARG RUNTIME_IMAGE=\K\S+' infra/docker/migrate.Dockerfile)
          test "$api_base" = "$web_base" || { echo "api and web pin different runtime bases"; exit 1; }
          test "$api_base" = "$migrate_base" || { echo "api and migrate pin different runtime bases"; exit 1; }
          echo "Runtime base: $api_base"
          ./cosign verify "$api_base" \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com > /dev/null
          echo "Upstream signature verified for $api_base" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the API, web and migrate images once (spec 0013 CS1, CS2; spec 0019 D3)
        run: |
          created=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          for img in api web migrate; do
            docker buildx build --load -f "infra/docker/${img}.Dockerfile" -t "univarse-${img}:ci" \
              --build-arg REVISION="${{ github.sha }}" --build-arg CREATED="$created" --build-arg VERSION="sha-${GITHUB_SHA::7}" .
            echo "univarse-${img}:ci image id $(docker image inspect -f '{{.Id}}' univarse-${img}:ci), size $(docker image inspect -f '{{.Size}}' univarse-${img}:ci) bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done
          # CS6: every later check runs against exactly these images; each re-checks the ID first.
          echo "API_IMAGE_ID=$(docker image inspect -f '{{.Id}}' univarse-api:ci)" >> "$GITHUB_ENV"
          echo "WEB_IMAGE_ID=$(docker image inspect -f '{{.Id}}' univarse-web:ci)" >> "$GITHUB_ENV"
          echo "MIGRATE_IMAGE_ID=$(docker image inspect -f '{{.Id}}' univarse-migrate:ci)" >> "$GITHUB_ENV"
      - name: Inspect the images — user, labels, no shell, no UniVarse source/test/env files, ownership (spec 0013 CS1, CS2)
        run: |
          node --test tools/images/rules.test.mjs
          node --test tools/images/verify-release.test.mjs
          node --test tools/images/release-cleanup.test.mjs
          node --test tools/images/prune.test.mjs
          node --test tools/images/registry-lock.test.mjs
          node --test tools/images/gates.test.mjs
          node --test tools/images/release-lib.test.mjs
          node --test tools/images/migrate-smoke.test.mjs
          node --test tools/images/signing-key.test.mjs
          node --test tools/images/password-prompt.test.mjs
          node --test tools/images/container.test.mjs
          node --test tools/vault-tls.test.mjs
          node tools/images/inspect.mjs univarse-api:ci --root app
          node tools/images/inspect.mjs univarse-web:ci --root app
          node tools/images/inspect.mjs univarse-migrate:ci --root app
      # Spec 0013 CS7–CS9 / ADR-029. Fail closed: each gate is its own step and the job stops at the first one
      # that fails or errors (a scanner or DB failure is a failure, never "no findings").
      - name: Install Trivy (checksum-verified) and check exceptions and policy (spec 0013 CS7)
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          curl -sSfLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          node --test tools/images/exceptions.test.mjs
          node tools/images/exceptions.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Vulnerability gate — zero HIGH/CRITICAL, fixed or not (spec 0013 CS6, CS7)
        env:
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
        run: |
          for img in api web migrate; do
            case "$img" in api) want="$API_IMAGE_ID" ;; web) want="$WEB_IMAGE_ID" ;; migrate) want="$MIGRATE_IMAGE_ID" ;; esac
            test "$(docker image inspect -f '{{.Id}}' "univarse-${img}:ci")" = "$want" || { echo "univarse-${img}:ci is not the image that was built and tested"; exit 1; }
            # Every severity, for the record (the DB is fetched fresh here; a fetch failure fails the step).
            ./trivy image --scanners vuln --format json --output "trivy-${img}.json" "univarse-${img}:ci"
            node tools/images/trivy-summary.mjs "trivy-${img}.json" "univarse-${img}:ci" | tee -a "$GITHUB_STEP_SUMMARY"
            # The gate: any HIGH or CRITICAL, fixed or unfixed, fails. Only exceptions in .trivyignore.yaml apply.
            ./trivy image --skip-db-update --scanners vuln --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 "univarse-${img}:ci"
          done
      - name: Secret gate — any finding blocks; node_modules, image config and history included (spec 0013 CS7)
        run: |
          for img in api web migrate; do
            ./trivy image --skip-db-update --scanners secret --secret-config tools/images/trivy-secret.yaml \
              --image-config-scanners secret --ignorefile .trivyignore.yaml --exit-code 1 "univarse-${img}:ci"
          done
      - name: Misconfiguration gate — Dockerfiles and image configuration, HIGH/CRITICAL block (spec 0013 CS7)
        run: |
          ./trivy config --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 infra/docker
          for img in api web migrate; do
            ./trivy image --skip-db-update --scanners misconfig --image-config-scanners misconfig \
              --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 "univarse-${img}:ci"
          done
      - name: SBOM from each built image, SPDX JSON (spec 0013 CS8)
        run: |
          for img in api web migrate; do
            ./trivy image --skip-db-update --format spdx-json --output "sbom-${img}.spdx.json" "univarse-${img}:ci"
            echo "univarse-${img}:ci SBOM: $(node -e "console.log(JSON.parse(require('fs').readFileSync('sbom-${img}.spdx.json','utf8')).packages.length)") packages" | tee -a "$GITHUB_STEP_SUMMARY"
            # Spec 0026 T30: no development-only package (Storybook) in an image.
            node --input-type=module -e "import { readFileSync } from 'node:fs'; import { devOnlyPackages } from './tools/images/release-lib.mjs'; const d = devOnlyPackages(JSON.parse(readFileSync('sbom-${img}.spdx.json', 'utf8'))); if (d.length) { console.error('univarse-${img}:ci holds development-only packages: ' + d.join(', ')); process.exit(1); }"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-and-scan-reports
          path: |
            sbom-*.spdx.json
            trivy-*.json
          retention-days: 30
      # Spec 0013 CS13: each gate fails for its intended reason on a harmless one-change mutant, and passes its clean
      # control: root user, shell, a fixable and an unfixed HIGH/CRITICAL, a root Dockerfile, expired/incomplete
      # exceptions, ignore-unfixed, an unreachable vulnerability DB, and an image substituted before and at push.
      # Runs the shared gate code (tools/images/gates.mjs) with its own Trivy cache and a throwaway registry.
      - name: Gate proofs — every gate fails for its intended reason (spec 0013 CS13)
        run: node tools/images/gate-proofs.mjs | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Hardened runtime smoke — read-only, UID 65532, no capabilities (spec 0013 CS4)
        run: node tools/images/smoke.mjs --api univarse-api:ci --web univarse-web:ci
      - name: Migrate job smoke — bootstrap, migrations, rls:check, seed and keys on a fresh database, hardened, twice (spec 0019 LS4)
        run: |
          test "$(docker image inspect -f '{{.Id}}' univarse-migrate:ci)" = "$MIGRATE_IMAGE_ID" || { echo "univarse-migrate:ci is not the image that was built and tested"; exit 1; }
          node tools/images/migrate-smoke.mjs univarse-migrate:ci | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Browser journeys against the containerised API, worker and web — desktop + mobile (spec 0013 CS5)
        # The same Playwright suite as source-mode E2E, but the API, worker and web are the images built above,
        # under the CI hardening, behind the same edge: login, MFA (TOTP, recovery code), step-up, reset via
        # Mailpit, upload → ClamAV scan → download.
        env:
          E2E_API_IMAGE: univarse-api:ci
          E2E_WEB_IMAGE: univarse-web:ci
        run: pnpm --filter @univarse/web test:e2e
      - name: Remove the journey containers (always)
        if: always()
        run: docker rm -f uv-e2e-api uv-e2e-web uv-e2e-worker uv-smoke-api uv-smoke-web uv-smoke-worker > /dev/null 2>&1 || true

  # Spec 0017 PB10: the PgBouncer image (built from verified source, on distroless), its gates and its coverage proofs.
  # Its own job, in parallel with build-test: the Grype database download and the nine coverage controls are slow, and a
  # failure here names PgBouncer. Every report is kept as an artifact, on failure as well as success.
  pgbouncer-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90 # the nine controls run the Grype gate about ten times on the real database
    env:
      EVIDENCE: pgbouncer-evidence # the Grype database cache is "$RUNNER_TEMP/grype-cache" (the runner context isn't allowed here)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Unit tests — tar reader, inventory, Grype gate and the controls harness (spec 0017 PB10)
        run: |
          mkdir -p "$EVIDENCE"
          node --test tools/images/tar.test.mjs tools/images/pgbouncer-inventory.test.mjs \
            tools/images/pgbouncer-grype-gate.test.mjs tools/images/pgbouncer-gate-proofs.test.mjs \
            tools/images/pgbouncer-upstream.test.mjs tools/pgbouncer/gateway.test.mjs
      - name: Verify the PgBouncer runtime base's upstream signature, before building (spec 0013 CS3, spec 0017 D1)
        env:
          COSIGN_VERSION: 3.1.3
          COSIGN_SHA256: 4629c757b7618056f8ddd7e2625ae9fdd94c0372a65049520bc7d9df9efc7f71
        run: |
          curl -sSfLo cosign "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  cosign" | sha256sum -c -
          chmod +x cosign
          df=infra/docker/pgbouncer.Dockerfile
          # Fail closed: exactly one digest-pinned RUNTIME_IMAGE, and the final stage is built FROM it.
          test "$(grep -c '^ARG RUNTIME_IMAGE=' "$df")" -eq 1 || { echo "$df must declare RUNTIME_IMAGE exactly once"; exit 1; }
          base=$(grep -oP '^ARG RUNTIME_IMAGE=\K\S+' "$df")
          [[ "$base" =~ @sha256:[0-9a-f]{64}$ ]] || { echo "$df: RUNTIME_IMAGE is not digest-pinned: $base"; exit 1; }
          test "$(grep '^FROM ' "$df" | tail -1)" = 'FROM ${RUNTIME_IMAGE} AS runtime' || { echo "$df: the final stage is not FROM \${RUNTIME_IMAGE}"; exit 1; }
          echo "PgBouncer runtime base: $base"
          ./cosign verify "$base" \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com \
            --certificate-oidc-issuer https://accounts.google.com > /dev/null
          rm cosign
          echo "Upstream signature verified for $base" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build the PgBouncer image (spec 0017 D1)
        run: |
          docker buildx build --load -f infra/docker/pgbouncer.Dockerfile -t univarse-pgbouncer:ci \
            --build-arg REVISION="${{ github.sha }}" --build-arg CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg VERSION="sha-${GITHUB_SHA::7}" .
          echo "univarse-pgbouncer:ci image id $(docker image inspect -f '{{.Id}}' univarse-pgbouncer:ci)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Inspect the image, and run it hardened — user, labels, no shell, ownership; read-only, UID 65532, no capabilities (spec 0013 CS1, CS4)
        run: |
          node tools/images/inspect.mjs univarse-pgbouncer:ci --root usr/bin
          docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges --user 65532:65532 \
            --network none univarse-pgbouncer:ci --version | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Install Trivy (checksum-verified) and fetch its database (spec 0013 CS7)
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
          TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2,public.ecr.aws/aquasecurity/trivy-db:2
          TRIVY_IMAGE: aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        run: |
          curl -sSfLo trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          ./trivy image --download-db-only
          # The controls run Trivy as the pinned container, on its own cache volume: fill that too, once.
          docker run --rm -e TRIVY_DB_REPOSITORY -v uv-trivy-cache:/root/.cache/trivy "$TRIVY_IMAGE" image --download-db-only
      - name: Trivy gates — zero HIGH/CRITICAL (Debian packages, routed to Trivy), secrets, misconfiguration, SBOM (spec 0013 CS6–CS8, spec 0017 PB10)
        run: |
          ./trivy image --skip-db-update --scanners vuln --format json --output "$EVIDENCE/trivy-pgbouncer.json" univarse-pgbouncer:ci
          node tools/images/trivy-summary.mjs "$EVIDENCE/trivy-pgbouncer.json" univarse-pgbouncer:ci | tee -a "$GITHUB_STEP_SUMMARY"
          ./trivy image --skip-db-update --scanners vuln --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 univarse-pgbouncer:ci
          ./trivy image --skip-db-update --scanners secret --secret-config tools/images/trivy-secret.yaml \
            --image-config-scanners secret --ignorefile .trivyignore.yaml --exit-code 1 univarse-pgbouncer:ci
          ./trivy image --skip-db-update --scanners misconfig --image-config-scanners misconfig \
            --severity HIGH,CRITICAL --ignorefile .trivyignore.yaml --exit-code 1 univarse-pgbouncer:ci
          ./trivy image --skip-db-update --format spdx-json --output "$EVIDENCE/sbom-pgbouncer.spdx.json" univarse-pgbouncer:ci
      - name: Inventory — generated from the image, then verified against it (spec 0017 PB10)
        run: |
          node tools/images/pgbouncer-inventory.mjs generate univarse-pgbouncer:ci "$EVIDENCE/inventory.cdx.json" | tee -a "$GITHUB_STEP_SUMMARY"
          node tools/images/pgbouncer-inventory.mjs verify univarse-pgbouncer:ci "$EVIDENCE/inventory.cdx.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Grype gate — PgBouncer by CPE, bound to this image and inventory (spec 0017 PB10)
        run: |
          mkdir -p "$RUNNER_TEMP/grype-cache"
          node tools/images/pgbouncer-grype-gate.mjs univarse-pgbouncer:ci "$EVIDENCE/inventory.cdx.json" \
            "$EVIDENCE/trivy-pgbouncer.json" "$EVIDENCE/gate" --cache "$RUNNER_TEMP/grype-cache" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Coverage controls — all nine must fail for their intended reasons, the real build must pass (spec 0017 PB10)
        run: |
          node tools/images/pgbouncer-gate-proofs.mjs univarse-pgbouncer:ci "$EVIDENCE/proofs" --cache "$RUNNER_TEMP/grype-cache" | tee -a "$GITHUB_STEP_SUMMARY"
      # Last, so a new upstream release doesn't stop the other gates producing their evidence.
      - name: No newer upstream PgBouncer release than the pin — a maintenance safeguard, not a substitute for the Grype match (spec 0017 PB10)
        run: |
          node tools/images/pgbouncer-upstream.mjs 2>&1 | tee "$EVIDENCE/upstream.txt" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Keep the evidence (always, failures included)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pgbouncer-image-evidence
          path: |
            pgbouncer-evidence/**
            !pgbouncer-evidence/**/*.tar
          retention-days: 30
          if-no-files-found: warn

  # Spec 0017 (D3, D4, PB1–PB9): the pooling probes and the three isolation suites through PgBouncer in transaction
  # mode. The same services and setup as build-test; PgBouncer runs as the runner's own non-root user (the auth file
  # is 0600 and theirs), with host.docker.internal mapped to the discovered IPv4 gateway (tools/pgbouncer/run.mjs).
  pgbouncer-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci-superuser-only
          TZ: Africa/Lagos # as in build-test: a non-UTC server (PB5's halves need it)
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.32.0
        ports: ['1025:1025', '8025:8025']
      vault:
        image: hashicorp/vault:2.1.1
        env:
          VAULT_DEV_ROOT_TOKEN_ID: ci-root-token-only
          VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
          SKIP_SETCAP: 'true'
        ports: ['8200:8200']
    env:
      NODE_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGSUPERPASSWORD: ci-superuser-only
      VALKEY_URL: redis://127.0.0.1:6379
      PGBOUNCER_IMAGE: univarse-pgbouncer:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate CI-only secrets
        run: |
          echo "SESSION_PEPPER=$(openssl rand -base64 32)" >> .env
          echo "DATA_ENCRYPTION_KEY_ID=ci-1" >> .env
          echo "DATA_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> .env
          echo "S3_ACCESS_KEY=uvci$(openssl rand -hex 8)" >> .env
          echo "S3_SECRET_KEY=$(openssl rand -hex 30)" >> .env
      - name: Start object storage + ClamAV (compose, same as dev)
        env: { VALKEY_PASSWORD: ci-compose-interpolation-only }
        run: |
          node tools/storage-dev.mjs config
          docker compose -f infra/compose/compose.dev.yml --env-file .env up -d seaweedfs clamav-test-sigs clamav
      - name: Build the PgBouncer image (spec 0017 D1; gated in pgbouncer-image)
        run: docker buildx build --load -f infra/docker/pgbouncer.Dockerfile -t "$PGBOUNCER_IMAGE" .
      - name: Build (includes Prisma generate)
        run: pnpm build
      - name: Unit tests of the runner, the comparison and the gateway discovery (spec 0017)
        run: node --test tools/pgbouncer/run.test.mjs tools/pgbouncer/compare.test.mjs tools/pgbouncer/gateway.test.mjs
      - name: Create roles + databases, the auth file and the profiles (db:setup, PB9)
        run: pnpm db:setup
      - name: Migrate, directly (PB8)
        run: pnpm db:migrate
      - name: Configure Vault (Transit, derived KEK, encrypt/decrypt-only app token)
        env:
          VAULT_ROOT_TOKEN: ci-root-token-only
        run: node tools/vault-dev.mjs
      - name: Seed, directly (PB8)
        run: pnpm db:seed
      - name: PB8 — migrations, setup, seeding and rls:check used direct URLs, never PgBouncer's
        run: |
          pnpm rls:check
          node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            const env = Object.fromEntries(readFileSync('.env', 'utf8').split('\n').filter((l) => l.includes('=')).map((l) => [l.slice(0, l.indexOf('=')), l.slice(l.indexOf('=') + 1)]));
            const direct = Object.entries(env).filter(([k]) => k.endsWith('_MIGRATOR_URL'));
            if (direct.length === 0) throw new Error('no migrator URLs');
            const where = (u) => { const x = new URL(u); return x.hostname + ':' + x.port; };
            const used = [...direct.map(([k, u]) => [k, where(u)]), ['superuser (db:setup)', process.env.PGHOST + ':' + process.env.PGPORT]];
            for (const [k, hp] of used) console.log(k + ' -> ' + hp);
            if (used.some(([, hp]) => hp.endsWith(':6432'))) throw new Error('a direct path uses PgBouncer');
          "
      - name: Wait for SeaweedFS + ClamAV, create buckets
        env: { VALKEY_PASSWORD: ci-compose-interpolation-only }
        run: |
          docker compose -f infra/compose/compose.dev.yml --env-file .env up -d --wait seaweedfs clamav
          node tools/storage-dev.mjs buckets
      - name: Start PgBouncer — probe profile (default_pool_size 2)
        run: node tools/pgbouncer/run.mjs start probe
      - name: PB7 — the API sheds PgBouncer's queue timeout as 503 server.busy (probe profile)
        run: |
          val() { grep "^$1=" .env | cut -d= -f2-; }
          PLATFORM_DATABASE_URL="$(val PGBOUNCER_PLATFORM_DATABASE_URL)" \
          TENANT_POOL_01_DATABASE_URL="$(val PGBOUNCER_TENANT_POOL_01_DATABASE_URL)" \
            pnpm --filter @univarse/api test:pgbouncer:probe --reporter=verbose
      - name: PB1, PB2, PB5, PB6, PB9 — the pooling probes, the rotation included (probe profile)
        env: { PGBOUNCER_PROBE_ROTATION: '1' }
        run: pnpm --filter @univarse/db test:pgbouncer:probe --reporter=verbose
      - name: Restart PgBouncer — suite profile (default_pool_size 10)
        run: node tools/pgbouncer/run.mjs start suite
      - name: PB3 — the three isolation suites, unchanged, through PgBouncer
        run: |
          val() { grep "^$1=" .env | cut -d= -f2-; }
          export PLATFORM_DATABASE_URL="$(val PGBOUNCER_PLATFORM_DATABASE_URL)"
          export TENANT_POOL_01_DATABASE_URL="$(val PGBOUNCER_TENANT_POOL_01_DATABASE_URL)"
          # Spec 0016: the relay's tests read .env.worker; this picks its PgBouncer URL (the relay role's own pool).
          export UNIVARSE_RELAY_THROUGH_PGBOUNCER=1
          R="$GITHUB_WORKSPACE/suite-results"
          status=0
          pnpm --filter @univarse/db test:int --reporter=default --reporter=json --outputFile.json="$R/db.json" || status=1
          pnpm --filter @univarse/crypto test:int --reporter=default --reporter=json --outputFile.json="$R/crypto.json" || status=1
          pnpm --filter @univarse/api test:int --reporter=verbose --reporter=json --outputFile.json="$R/api.json" || status=1
          exit $status
      - name: PgBouncer's log (always)
        if: always()
        run: |
          mkdir -p suite-results
          docker logs univarse-pgbouncer > suite-results/pgbouncer.log 2>&1 || true
          tail -40 suite-results/pgbouncer.log || true
      - name: Keep the results for pgbouncer-compare (always)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: suite-results-pgbouncer
          path: suite-results/
          retention-days: 30
          if-no-files-found: warn

  # Spec 0017 PB3: joins the two runs once both have finished; nothing depends on an unfinished job's logs. Runs
  # whatever they concluded and fails unless both succeeded, so a skipped comparison never reads as a pass.
  pgbouncer-compare:
    runs-on: ubuntu-24.04
    needs: [build-test, pgbouncer-isolation]
    if: always()
    timeout-minutes: 10
    steps:
      - name: Both runs must have succeeded
        env:
          BUILD_TEST: ${{ needs.build-test.result }}
          ISOLATION: ${{ needs.pgbouncer-isolation.result }}
        run: |
          echo "build-test: $BUILD_TEST; pgbouncer-isolation: $ISOLATION"
          test "$BUILD_TEST" = success && test "$ISOLATION" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: suite-results-direct
          path: results/direct
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: suite-results-pgbouncer
          path: results/pgbouncer
      - name: The same files, tests and skips; every test passed through PgBouncer (PB3)
        run: |
          node --test tools/pgbouncer/compare.test.mjs
          node tools/pgbouncer/compare.mjs results/direct results/pgbouncer | tee -a "$GITHUB_STEP_SUMMARY"
