# UniVarse Docker Compose
# Multi-tenant university management system

version: '3.8'

services:
  # ===========================================
  # DATABASES
  # ===========================================

  # Master Database - Institution registry
  master-db:
    image: postgres:15-alpine
    container_name: univarse-master-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: univarse_master
      POSTGRES_USER: univarse_admin
      POSTGRES_PASSWORD: ${MASTER_DB_PASSWORD:-supersecret}
    ports:
      - "5433:5432"
    volumes:
      - master_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U univarse_admin -d univarse_master" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Tenant Database Template (for development)
  # In production, each institution would have its own DB
  tenant-db:
    image: postgres:15-alpine
    container_name: univarse-tenant-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: univarse_tenant_dev
      POSTGRES_USER: univarse_tenant
      POSTGRES_PASSWORD: ${TENANT_DB_PASSWORD:-tenantsecret}
    ports:
      - "5434:5432"
    volumes:
      - tenant_db_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U univarse_tenant -d univarse_tenant_dev" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # ===========================================
  # BACKEND SERVICES
  # ===========================================

  # Auth Service (Node.js)
  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: univarse-auth-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      MASTER_DATABASE_URL: postgresql://univarse_admin:${MASTER_DB_PASSWORD:-supersecret}@master-db:5432/univarse_master
      JWT_SECRET: ${JWT_SECRET:-change-in-production}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-32-character-encryption-key!!}
    ports:
      - "4000:4000"
    depends_on:
      master-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:4000/health" ]
      interval: 10s
      timeout: 5s
      retries: 3

  # Laravel Service (PHP) - Future
  # laravel-service:
  #   build:
  #     context: ./laravel-service
  #     dockerfile: Dockerfile
  #   container_name: univarse-laravel-service
  #   ports:
  #     - "8000:8000"
  #   depends_on:
  #     - master-db

  # ===========================================
  # FRONTEND
  # ===========================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: univarse-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - auth-service

  # ===========================================
  # UTILITIES
  # ===========================================

  # Redis for caching and sessions (optional)
  redis:
    image: redis:7-alpine
    container_name: univarse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  master_db_data:
  tenant_db_data:
  redis_data:


networks:
  default:
    name: univarse-network
